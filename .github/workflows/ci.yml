name: CI

on:
  push:
    branches: [main, main-logic/v1]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Only the Node/TS side is checked here. The Python engine pulls torch
      # (~2GB), so it's intentionally not built in CI.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
